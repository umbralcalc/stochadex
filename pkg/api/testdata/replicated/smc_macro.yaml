# cfg/example_smc_config.yaml with a stochastic particle model (an
# Ornstein-Uhlenbeck process reverting to the particle's mean), so each
# particle's per-round seed reaches the result. smc_twin.yaml is its core
# language twin.
inputs:
  data:
    simulation:
      steps: 60
      timestep: 1.0
      partitions:
      - name: obs
        iteration: {type: data_generation, likelihood: {type: normal}}
        params: {mean: [2.0], covariance_matrix: [0.5]}
        init_state_values: [2.0]
        state_history_depth: 1
        seed: 7
macros:
- type: smc_inference
  proposal_name: smc_proposals
  sim_name: smc_sim
  posterior_name: smc_posterior
  num_particles: 100
  num_rounds: 3
  seed: 42
  priors: [{type: uniform, lo: -5.0, hi: 10.0}]
  param_names: [mean]
  model:
    observed_data: {name: observed_data, ref: {partition_name: obs}}
    partitions:
    - name: "pred"
      iteration: {type: param_values}
      params: {param_values: [0.0]}
      init_state_values: [0.0]
      state_history_depth: 2
    - name: "noisy"
      iteration: {type: ornstein_uhlenbeck}
      params: {thetas: [1.0], mus: [0.0], sigmas: [0.3]}
      init_state_values: [2.0]
      state_history_depth: 2
    - name: "loglike"
      iteration: {type: data_comparison, likelihood: {type: normal}}
      params: {mean: [0.0], variance: [0.5], latest_data_values: [2.0], cumulative: [1], burn_in_steps: [0]}
      params_from_upstream:
        mean: {upstream: "noisy"}
        latest_data_values: {upstream: observed_data}
      init_state_values: [0.0]
      state_history_depth: 2
    loglike_partition: "loglike"
    param_forwarding:
      "pred/param_values": [0]
      "noisy/mus": [0]
